# Local development / test database only. Production uses deploy/compose.yml.
name: tavalod-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tavalod
      POSTGRES_PASSWORD: tavalod
      POSTGRES_DB: tavalod
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/dev-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavalod -d tavalod"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
